# =====================================================================
# invoice-experience-api - LOCAL configuration
# UPPER_SNAKE_CASE keys = secrets / environment specific; an environment
# variable or -D system property with the same name overrides them.
# =====================================================================
PROCESS_API_HOST: "localhost"
PROCESS_API_PORT: "8082"
PROCESS_API_PROTOCOL: "HTTP"
PROCESS_API_CLIENT_ID: "invoice-experience-client"
PROCESS_API_CLIENT_SECRET: "local-dev-process-secret"     # local demo only
SYS_API_HOST: "localhost"
SYS_API_PORT: "8083"
SYS_API_PROTOCOL: "HTTP"
INTERNAL_CLIENT_ID: "invoice-internal-client"
INTERNAL_CLIENT_SECRET: "local-dev-internal-secret"       # local demo only

http:
  host: "0.0.0.0"
  port: "8081"

process:
  api:
    basePath: "/process/v1"
    timeoutMs: "240000"     # synchronous processing may include AI + ERP calls
sys:
  api:
    basePath: "/sys/v1"
    timeoutMs: "15000"

upload:
  maxFileSizeBytes: "10485760"    # 10 MB

idempotency:
  ttlHours: "24"

security:
  usersFile: "security/users.json"
