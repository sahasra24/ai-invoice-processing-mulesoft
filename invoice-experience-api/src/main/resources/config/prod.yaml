# =====================================================================
# invoice-experience-api - PROD / CloudHub configuration
# UPPER_SNAKE_CASE keys = secrets / environment specific; an environment
# variable or -D system property with the same name overrides them.
# =====================================================================
PROCESS_API_HOST: "set-as-deployment-property"
PROCESS_API_PORT: "443"
PROCESS_API_PROTOCOL: "HTTPS"
PROCESS_API_CLIENT_ID: "${secure::process.clientId}"
PROCESS_API_CLIENT_SECRET: "${secure::process.clientSecret}"
SYS_API_HOST: "set-as-deployment-property"
SYS_API_PORT: "443"
SYS_API_PROTOCOL: "HTTPS"
INTERNAL_CLIENT_ID: "${secure::internal.clientId}"
INTERNAL_CLIENT_SECRET: "${secure::internal.clientSecret}"

http:
  host: "0.0.0.0"
  port: "8081"

process:
  api:
    basePath: "/process/v1"
    timeoutMs: "240000"     # synchronous processing may include AI + ERP calls
sys:
  api:
    basePath: "/sys/v1"
    timeoutMs: "15000"

upload:
  maxFileSizeBytes: "10485760"    # 10 MB

idempotency:
  ttlHours: "24"

security:
  usersFile: "security/users.json"
