<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="400" viewBox="0 0 1000 400">
<rect width="1000" height="400" fill="#ffffff"/>
<text x="24" y="32" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#263238">Invoice routing (approval-routing.dwl) - evaluated top to bottom</text>
<rect x="24" y="54" width="952" height="40" rx="8" fill="#eceff1" stroke="#546e7a" stroke-opacity="0.45"/>
<text x="40" y="79" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#546e7a">DUPLICATE</text>
<text x="300" y="79" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#37474f">Exact duplicate (same vendor + normalized invoice number)</text>
<text x="960" y="79" text-anchor="end" font-family="Consolas, 'SFMono-Regular', Menlo, monospace" font-size="12" fill="#78909c">HTTP 409</text>
<rect x="24" y="100" width="952" height="40" rx="8" fill="#ffebee" stroke="#c62828" stroke-opacity="0.45"/>
<text x="40" y="125" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#c62828">VALIDATION_FAILED</text>
<text x="300" y="125" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#37474f">Blocking error on a reliable extraction (missing fields, unknown vendor)</text>
<text x="960" y="125" text-anchor="end" font-family="Consolas, 'SFMono-Regular', Menlo, monospace" font-size="12" fill="#78909c">HTTP 422</text>
<rect x="24" y="146" width="952" height="40" rx="8" fill="#fff8e1" stroke="#ef6c00" stroke-opacity="0.45"/>
<text x="40" y="171" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#ef6c00">MANUAL_REVIEW</text>
<text x="300" y="171" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#37474f">Low AI confidence, PO / price / total / tax exceptions -&gt; MANAGER (FINANCE_DIRECTOR &gt; 50k)</text>
<text x="960" y="171" text-anchor="end" font-family="Consolas, 'SFMono-Regular', Menlo, monospace" font-size="12" fill="#78909c">HTTP 201</text>
<rect x="24" y="192" width="952" height="40" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-opacity="0.45"/>
<text x="40" y="217" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#2e7d32">AUTO-APPROVED</text>
<text x="300" y="217" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#37474f">Total &lt;= 1,000 and all checks passed -&gt; posted to the ERP automatically</text>
<text x="960" y="217" text-anchor="end" font-family="Consolas, 'SFMono-Regular', Menlo, monospace" font-size="12" fill="#78909c">HTTP 201</text>
<rect x="24" y="238" width="952" height="40" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-opacity="0.45"/>
<text x="40" y="263" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#1565c0">APPROVER</text>
<text x="300" y="263" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#37474f">1,000 &lt; total &lt;= 10,000</text>
<text x="960" y="263" text-anchor="end" font-family="Consolas, 'SFMono-Regular', Menlo, monospace" font-size="12" fill="#78909c">HTTP 201</text>
<rect x="24" y="284" width="952" height="40" rx="8" fill="#e8eaf6" stroke="#3949ab" stroke-opacity="0.45"/>
<text x="40" y="309" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#3949ab">MANAGER</text>
<text x="300" y="309" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#37474f">10,000 &lt; total &lt;= 50,000</text>
<text x="960" y="309" text-anchor="end" font-family="Consolas, 'SFMono-Regular', Menlo, monospace" font-size="12" fill="#78909c">HTTP 201</text>
<rect x="24" y="330" width="952" height="40" rx="8" fill="#f3e5f5" stroke="#6a1b9a" stroke-opacity="0.45"/>
<text x="40" y="355" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#6a1b9a">MANAGER &gt; FINANCE_DIRECTOR</text>
<text x="300" y="355" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#37474f">Total &gt; 50,000 (two-level approval)</text>
<text x="960" y="355" text-anchor="end" font-family="Consolas, 'SFMono-Regular', Menlo, monospace" font-size="12" fill="#78909c">HTTP 201</text>
<text x="24" y="394" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#78909c">Thresholds and tolerances are configurable in invoice-process-api/src/main/resources/config/*.yaml (approval.*, validation.*).</text>
</svg>
